[workspace]
members = ["crates/serial-core"]

[package]
name = "serio"
version = "0.1.0"
description = "A modern serial communication terminal"
edition = "2021"
publish = false

# The `_lib` suffix may seem redundant but it is necessary to make the lib
# name unique and wouldn't conflict with the bin name. This seems to be only
# an issue on Windows; see https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "serio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
serio-serial = { path = "crates/serial-core" }

[features]
default = ["udev"]
# libudev-backed enumeration on Linux. Turn off with `--no-default-features`
# on machines without libudev-dev.
udev = ["serio-serial/udev"]
