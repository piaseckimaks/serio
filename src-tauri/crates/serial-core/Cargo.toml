[package]
name = "serio-serial"
version = "0.1.0"
edition = "2021"
description = "Serial port core for serio: port enumeration, connection management and the reader thread"
publish = false

[features]
default = []
# Enables libudev-based enumeration on Linux (richer USB metadata).
# Requires libudev-dev at build time; disabled by default so the crate
# builds and tests on machines without it.
udev = ["serialport/libudev"]

[dependencies]
serialport = { version = "4.5", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
